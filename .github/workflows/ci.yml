name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Check, Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@1a4442cacd436585916779262731d5b162bc6ec7 # v4.2.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Lint copy and language rules
        run: npm run lint:copy

      - name: Run unit tests
        run: npm run test

      - name: Production dependency security audit
        run: npm run audit

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_SITE_URL: "https://projects.vtuadda.com"
          NEXT_PUBLIC_SUPABASE_URL: "https://mockproject.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock_anon_key_mock_anon_key_mock_anon_key"
          SUPABASE_SERVICE_ROLE_KEY: "mock_service_key_mock_service_key_mock_service"
          RESEND_API_KEY: "re_mock_resend_api_key_for_ci_build"
          EMAIL_FROM: "no-reply@projects.vtuadda.com"
          CRON_SECRET: "ci_cron_secret_minimum_32_characters_string"
          IP_HASH_SALT: "ci_ip_hash_salt_minimum_32_characters_string"
        run: npm run build

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@a6a42252a0a2dfdcf9cf391e4ab696e30b62e49c # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
